      <rect x="74" y="90" width="78" height="210" rx="20" fill="url(#metal)"/>
      <rect x="165" y="114" width="96" height="164" rx="18" fill="url(#watchFace)" stroke="#8e746f" stroke-width="8"/>
      <rect x="137" y="166" width="178" height="72" rx="30" fill="url(#metal)"/>
      <circle cx="213" cy="196" r="52" fill="#2a2a2c" stroke="#9f8d86" stroke-width="3"/>
      <line x1="213" y1="196" x2="213" y2="156" stroke="#f1ece2" stroke-width="3" stroke-linecap="round"/>
      <line x1="213" y1="196" x2="248" y2="210" stroke="#f1ece2" stroke-width="3" stroke-linecap="round"/>
      <circle cx="213" cy="196" r="4" fill="#f1ece2"/>
      <rect x="166" y="176" width="8" height="18" rx="4" fill="#d7ccc3"/>
      <rect x="214" y="144" width="8" height="18" rx="4" fill="#d7ccc3"/>
      <rect x="250" y="188" width="8" height="18" rx="4" fill="#d7ccc3"/>
      <rect x="208" y="232" width="8" height="18" rx="4" fill="#d7ccc3"/>
