    <rect x="20" y="95" width="110" height="4" rx="2" fill="#292d35"/>
    <rect x="20" y="76" width="130" height="1.2" fill="#393d46"/>
    <polygon points="210,170 338,54 455,54 326,170" fill="#1f2128"/>
