    <rect x="18" y="18" width="36" height="22" rx="11" fill="#101114" stroke="#31333a"/>
    <rect x="66" y="18" width="60" height="22" rx="11" fill="#101114" stroke="#31333a"/>
    <text x="36" y="34" fill="#b9bcc3" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">02</text>
